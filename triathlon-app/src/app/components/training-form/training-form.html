<form (ngSubmit)="onSubmit()" #trainingForm="ngForm" class="space-y-5 pb-6">
  <div>
    <label class="field-label" for="title">Titel</label>
    <input
      id="title"
      type="text"
      name="title"
      [(ngModel)]="formData.title"
      required
      class="field-input"
      placeholder="bv. Ochtendloop"
    />
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="field-label" for="date">Datum</label>
      <input
        id="date"
        type="date"
        name="date"
        [(ngModel)]="formData.date"
        required
        class="field-input"
      />
    </div>
    <div>
      <label class="field-label" for="startTime">Startuur</label>
      <input
        id="startTime"
        type="time"
        name="startTime"
        [(ngModel)]="formData.startTime"
        required
        class="field-input"
      />
    </div>
  </div>

  <div>
    <span class="field-label">Discipline</span>
    <div class="grid grid-cols-2 gap-2">
      @for (d of disciplines; track d) {
        <button
          type="button"
          (click)="selectDiscipline(d)"
          [class]="
            'flex min-h-12 items-center justify-center gap-2 rounded-xl border text-sm font-semibold transition active:scale-[0.98] ' +
            (formData.discipline === d
              ? disciplineMeta[d].activeClass
              : 'border-app-border bg-app-surface text-app-muted')
          "
        >
          <span aria-hidden="true">{{ disciplineMeta[d].icon }}</span>
          {{ disciplineMeta[d].label }}
        </button>
      }
    </div>
    <input type="hidden" name="discipline" [(ngModel)]="formData.discipline" required />
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="field-label" for="duration">Duur (min)</label>
      <input
        id="duration"
        type="number"
        name="duration"
        [(ngModel)]="formData.duration"
        required
        min="1"
        class="field-input"
      />
    </div>
    <div>
      <label class="field-label" for="distance">Afstand (km)</label>
      <input
        id="distance"
        type="number"
        name="distance"
        [(ngModel)]="formData.distance"
        min="0"
        step="0.1"
        class="field-input"
        placeholder="Optioneel"
      />
    </div>
  </div>

  <div class="card">
    <label class="field-label" for="feeling">Gevoel — {{ formData.feeling }}/10</label>
    <input
      id="feeling"
      type="range"
      name="feeling"
      [(ngModel)]="formData.feeling"
      min="1"
      max="10"
      class="mt-2 w-full accent-app-accent"
    />
  </div>

  <div>
    <label class="field-label" for="notes">Notities</label>
    <textarea
      id="notes"
      name="notes"
      [(ngModel)]="formData.notes"
      rows="3"
      class="field-input min-h-[5.5rem] resize-none py-3"
      placeholder="Hoe verliep de training?"
    ></textarea>
  </div>

  <button type="submit" [disabled]="trainingForm.invalid" class="btn-primary">
    Training opslaan
  </button>
</form>
