<div class="min-h-screen flex items-center justify-center bg-gray-950">
  <div class="bg-gray-900 p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold text-white mb-6">
      {{ isLogin ? 'Inloggen' : 'Registreren' }}
    </h1>

    <div class="flex flex-col gap-4">
      <input
        type="email"
        [(ngModel)]="email"
        placeholder="E-mailadres"
        class="bg-gray-800 text-white rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
      />
      <input
        type="password"
        [(ngModel)]="password"
        placeholder="Wachtwoord"
        class="bg-gray-800 text-white rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
      />

      @if (errorMessage) {
        <p class="text-red-400 text-sm">{{ errorMessage }}</p>
      }

      <button
        (click)="onSubmit()"
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-colors"
      >
        {{ isLogin ? 'Inloggen' : 'Registreren' }}
      </button>

      <button
        (click)="toggleMode()"
        class="text-gray-400 hover:text-white text-sm transition-colors"
      >
        {{ isLogin ? 'Nog geen account? Registreer je hier.' : 'Al een account? Log hier in.' }}
      </button>
    </div>
  </div>
</div>
