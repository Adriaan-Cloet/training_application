<div class="max-w-lg mx-auto space-y-6">
  <h1 class="text-2xl font-bold text-gray-800">Instellingen</h1>

  <div class="bg-white rounded-xl shadow p-6 space-y-4">
    <h2 class="text-lg font-semibold text-gray-700">Doelrace</h2>

    <div class="space-y-1">
      <label class="block text-sm font-medium text-gray-600">Racenaam</label>
      <input
        type="text"
        [(ngModel)]="raceName"
        placeholder="bv. Ironman 70.3 Knokke-Heist"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <div class="space-y-1">
      <label class="block text-sm font-medium text-gray-600">Racedatum</label>
      <input
        type="date"
        [(ngModel)]="raceDate"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <div class="space-y-1">
      <label class="block text-sm font-medium text-gray-600">Startdatum voorbereiding</label>
      <input
        type="date"
        [(ngModel)]="trainingStartDate"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <p class="text-xs text-gray-400">Wordt gebruikt voor de voortgangsbalk op de homepagina.</p>
    </div>

    <div class="flex items-center gap-3">
      <input
        type="checkbox"
        id="countdownToggle"
        [(ngModel)]="countdownEnabled"
        class="w-4 h-4 accent-blue-600"
      />
      <label for="countdownToggle" class="text-sm font-medium text-gray-600">Afteller tonen op homepagina</label>
    </div>
  </div>

  <div class="flex items-center gap-4">
    <button
      (click)="onSubmit()"
      class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700 transition"
    >
      Opslaan
    </button>
    @if (opgeslagen) {
      <span class="text-green-600 text-sm font-medium">✓ Instellingen opgeslagen</span>
    }
    <a
    routerLink="/"
    class="text-sm text-gray-500 hover:text-gray-700 transition-colors"
    >
    ← Terug naar home
    </a>
  </div>
</div>
