<div class="page">
  <header class="mb-5">
    <p class="section-title">Profiel</p>
    <h1 class="text-2xl font-bold text-app-text">Instellingen</h1>
  </header>

  <section class="mb-6 space-y-3">
    <h2 class="section-title px-1">Doelrace</h2>
    <div class="card space-y-4">
      <div>
        <label class="field-label" for="raceName">Racenaam</label>
        <input
          id="raceName"
          type="text"
          [(ngModel)]="raceName"
          placeholder="Ironman 70.3 Knokke-Heist"
          class="field-input"
        />
      </div>

      <div>
        <label class="field-label" for="raceDate">Racedatum</label>
        <input id="raceDate" type="date" [(ngModel)]="raceDate" class="field-input" />
      </div>

      <div>
        <label class="field-label" for="trainingStartDate">Start voorbereiding</label>
        <input
          id="trainingStartDate"
          type="date"
          [(ngModel)]="trainingStartDate"
          class="field-input"
        />
        <p class="mt-1.5 text-xs text-app-muted">Voor de voortgangsbalk op home.</p>
      </div>

      <label class="flex min-h-12 items-center gap-3 rounded-xl border border-app-border bg-app-bg px-4">
        <input
          type="checkbox"
          id="countdownToggle"
          [(ngModel)]="countdownEnabled"
          class="h-5 w-5 rounded accent-app-accent"
        />
        <span class="text-sm font-medium text-app-text">Afteller op home tonen</span>
      </label>

      <button type="button" (click)="onSubmitRace()" class="btn-primary">Opslaan</button>
      @if (opgeslagen) {
        <p class="text-center text-sm font-medium text-emerald-400">Instellingen opgeslagen</p>
      }
    </div>
  </section>

  <section class="mb-6 space-y-3">
    <h2 class="section-title px-1">Beveiliging</h2>
    <div class="card space-y-4">
      <div>
        <label class="field-label" for="newPassword">Nieuw wachtwoord</label>
        <input
          id="newPassword"
          type="password"
          [(ngModel)]="newPassword"
          placeholder="Minimaal 6 tekens"
          class="field-input"
        />
      </div>

      <div>
        <label class="field-label" for="confirmPassword">Bevestig wachtwoord</label>
        <input
          id="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          placeholder="Herhaal wachtwoord"
          class="field-input"
        />
      </div>

      @if (passwordError) {
        <p class="text-sm text-rose-400">{{ passwordError }}</p>
      }

      <button type="button" (click)="onSubmitPassword()" class="btn-primary">
        Wachtwoord wijzigen
      </button>
      @if (passwordOpgeslagen) {
        <p class="text-center text-sm font-medium text-emerald-400">Wachtwoord gewijzigd</p>
      }
    </div>
  </section>

  <section class="space-y-3">
    <h2 class="section-title px-1">Account</h2>
    <div class="card space-y-4">
      <button type="button" (click)="onSignOut()" class="btn-secondary">Uitloggen</button>

      <div class="rounded-xl border border-rose-500/30 bg-rose-500/5 p-4 space-y-3">
        <p class="text-sm font-semibold text-rose-300">Account verwijderen</p>
        <p class="text-xs text-app-muted">
          Permanent. Typ
          <span class="font-mono font-semibold text-app-text">{{ DELETE_PHRASE }}</span>
        </p>
        <input
          type="text"
          [(ngModel)]="deleteConfirmText"
          placeholder="Bevestigingszin"
          class="field-input border-rose-500/40 focus:ring-rose-400/30"
        />
        <button
          type="button"
          (click)="onDeleteAccount()"
          [disabled]="!canDelete || isDeleting"
          class="flex min-h-12 w-full items-center justify-center rounded-xl bg-rose-600 px-4 text-base font-semibold text-white transition active:scale-[0.98] disabled:opacity-40"
        >
          @if (isDeleting) {
            Verwijderen...
          } @else {
            Account permanent verwijderen
          }
        </button>
      </div>
    </div>
  </section>
</div>
