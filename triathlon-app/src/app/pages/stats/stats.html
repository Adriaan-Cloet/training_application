<div class="page">
  <header class="mb-5">
    <p class="section-title">Analyse</p>
    <h1 class="text-2xl font-bold text-app-text">Statistieken</h1>
  </header>

  <div class="card space-y-5">
    <div>
      <p class="section-title mb-2">Periode</p>
      <div class="flex flex-wrap gap-2">
        @for (p of periodes; track p.value) {
          <button
            type="button"
            (click)="setPeriode(p.value)"
            [class]="'chip ' + (periode === p.value ? 'chip--active' : '')"
          >
            {{ p.label }}
          </button>
        }
      </div>
    </div>

    <div>
      <p class="section-title mb-2">Eenheid</p>
      <div class="flex gap-2">
        <button
          type="button"
          (click)="setEenheid('minuten')"
          [class]="'chip flex-1 ' + (eenheid === 'minuten' ? 'chip--active' : '')"
        >
          Minuten
        </button>
        <button
          type="button"
          (click)="setEenheid('kilometers')"
          [class]="'chip flex-1 ' + (eenheid === 'kilometers' ? 'chip--active' : '')"
        >
          Kilometers
        </button>
      </div>
    </div>

    <div class="flex items-center justify-between gap-3">
      <button
        type="button"
        (click)="toggleKracht()"
        [class]="'chip ' + (krachttrainingIncluded ? 'chip--active' : '')"
      >
        Krachttraining
      </button>
      <span class="text-xs text-app-muted">
        {{ krachttrainingIncluded ? 'Inbegrepen' : 'Uitgesloten' }}
      </span>
    </div>

    @if (chartData.datasets.length > 0 && chartData.labels && chartData.labels.length > 0) {
      <div class="h-56 w-full">
        <canvas baseChart [data]="chartData" [options]="chartOptions" type="bar"></canvas>
      </div>
    } @else {
      <p class="py-10 text-center text-sm text-app-muted">Geen trainingen voor deze periode.</p>
    }
  </div>
</div>
