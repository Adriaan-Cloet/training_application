<div class="max-w-2xl mx-auto">
  <!-- Niet gevonden -->
  <div *ngIf="!training" class="text-gray-500 text-sm">
    Training niet gevonden.
  </div>

  <!-- Leesweergave -->
  <div *ngIf="training && !isEditing" class="bg-white rounded-2xl shadow p-6 space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-2xl font-bold text-gray-800">{{ training.title }}</h2>
      <button (click)="goBack()" class="text-sm text-blue-600 hover:underline">← Terug</button>
    </div>

    <div class="grid grid-cols-2 gap-4 text-sm text-gray-600">
      <div>
        <p class="text-xs text-gray-400 uppercase font-medium">Datum</p>
        <p>{{ training.date }}</p>
      </div>
      <div>
        <p class="text-xs text-gray-400 uppercase font-medium">Discipline</p>
        <p>{{ training.discipline }}</p>
      </div>
      <div>
        <p class="text-xs text-gray-400 uppercase font-medium">Duur</p>
        <p>{{ training.duration }} min</p>
      </div>
      <div *ngIf="training.distance">
        <p class="text-xs text-gray-400 uppercase font-medium">Afstand</p>
        <p>{{ training.distance }} km</p>
      </div>
      <div *ngIf="training.feeling">
        <p class="text-xs text-gray-400 uppercase font-medium">Gevoel</p>
        <p>{{ training.feeling }}/10</p>
      </div>
    </div>

    <div *ngIf="training.notes">
      <p class="text-xs text-gray-400 uppercase font-medium">Notities</p>
      <p class="text-sm text-gray-600 mt-1">{{ training.notes }}</p>
    </div>

    <button
      (click)="startEdit()"
      class="mt-2 bg-blue-600 text-white py-2 px-4 rounded-lg font-semibold hover:bg-blue-700 transition"
    >
      Bewerken
    </button>
  </div>

  <!-- Bewerkweergave -->
  <div *ngIf="training && isEditing" class="bg-white rounded-2xl shadow p-6 space-y-5">
    <div class="flex items-center justify-between">
      <h2 class="text-xl font-bold text-gray-800">Training bewerken</h2>
      <a routerLink="/" class="text-sm text-blue-600 hover:underline">← Terug</a>
    </div>

    <!-- Titel -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Titel</label>
      <input type="text" name="title" [(ngModel)]="editData.title" required
             class="w-full rounded-lg border-gray-300 shadow-sm focus:ring-2 focus:ring-blue-500" />
    </div>

    <!-- Datum -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Datum</label>
      <input type="date" name="date" [(ngModel)]="editData.date" required
             class="w-full rounded-lg border-gray-300 shadow-sm focus:ring-2 focus:ring-blue-500" />
    </div>

    <!-- Startuur -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Startuur (24u)</label>
      <input type="time" name="startTime" [(ngModel)]="editData.startTime" required
             class="w-full rounded-lg border-gray-300 shadow-sm focus:ring-2 focus:ring-blue-500" />
    </div>

    <!-- Discipline -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Discipline</label>
      <select name="discipline" [(ngModel)]="editData.discipline"
              class="w-full rounded-lg border-gray-300 shadow-sm focus:ring-2 focus:ring-blue-500">
        <option *ngFor="let d of disciplines" [value]="d">{{ d }}</option>
      </select>
    </div>

    <!-- Duur -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Duur (minuten)</label>
      <input type="number" name="duration" [(ngModel)]="editData.duration" required min="1"
             class="w-full rounded-lg border-gray-300 shadow-sm focus:ring-2 focus:ring-blue-500" />
    </div>

    <!-- Afstand -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Afstand (km, optioneel)</label>
      <input type="number" name="distance" [(ngModel)]="editData.distance" min="0" step="0.1"
             class="w-full rounded-lg border-gray-300 shadow-sm focus:ring-2 focus:ring-blue-500" />
    </div>

    <!-- Gevoel -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Gevoel: {{ editData.feeling }}/10</label>
      <input type="range" name="feeling" [(ngModel)]="editData.feeling" min="1" max="10"
             class="w-full accent-blue-500" />
    </div>

    <!-- Notities -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Notities (optioneel)</label>
      <textarea name="notes" [(ngModel)]="editData.notes" rows="3"
                class="w-full rounded-lg border-gray-300 shadow-sm focus:ring-2 focus:ring-blue-500"></textarea>
    </div>

    <!-- Knoppen -->
    <div class="flex gap-3">
      <button (click)="saveEdit()"
              class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-lg font-semibold hover:bg-blue-700 transition">
        Opslaan
      </button>
      <button (click)="cancelEdit()"
              class="flex-1 bg-gray-100 text-gray-700 py-2 px-4 rounded-lg font-semibold hover:bg-gray-200 transition">
        Annuleren
      </button>
    </div>
  </div>
</div>
